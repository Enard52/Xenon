name: Publish to PyPI

# 暂改为手动触发：PyPI 上还没有 xenon-harness 项目（未配置 Trusted
# Publisher），tag 自动触发只会产生必红的运行。待 PyPI 项目建立并配好
# OIDC 后，改回 `push: tags: ["v*"]` 即可自动发布。
on:
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI Trusted Publisher (OIDC)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
