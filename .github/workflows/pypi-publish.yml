name: Publish to PyPI

# tag 自动触发 + 手动触发双通道。PyPI 侧需先配置 Trusted Publisher
# （pending publisher：project=xenon-harness, owner=xianyu-sheng,
#  repo=Xenon, workflow=pypi-publish.yml，environment 留空）。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI Trusted Publisher (OIDC)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Verify tag matches package version
        run: |
          python -c "import os,sys,xenon; t=os.environ['GITHUB_REF_NAME'].lstrip('v'); sys.exit(0 if xenon.__version__==t else f'tag {t} != version {xenon.__version__}')"

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
